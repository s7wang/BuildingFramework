# 文件路径 | 豁免检查项目
#
# 检查项目：
# format  : LF 格式检查
# charset : UTF-8 编码、中文字符检查
# blank   : 文件末尾多余空行检查
# all     : 豁免所有检查
#
# 支持 Shell 风格路径匹配（*、?）
# 路径相对于项目根目录
#
# 示例：

# README.md 豁免中文字符检查
README.md|charset
# File path | Exemption rules
check-tools/exemptions.conf|charset

# Makefile 豁免末尾空行检查
Makefile|blank

# 所有 Markdown 文件豁免中文字符检查
*.md|charset

# 某个文件豁免格式和空行检查
check-tools/example.sh|format,blank

# 完全豁免某个文件
check-tools/vendor/*|all